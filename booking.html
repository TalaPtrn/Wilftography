<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Confirmed - WILFTOGRAPHY</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      overflow-y: scroll;
    }

    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -2;
    }

    .video-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(8px);
      transform: scale(1.1);
    }

    .header {
      background-color: rgba(44, 44, 45, 0.403);
      backdrop-filter: blur(30px);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    .logo-img {
      height: 120px;
      margin-bottom: 5px;
    }

    .confirmation-box {
      width: 70%;
      max-width: 600px;
      margin: 100px auto;
      padding: 30px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      color: white;
      text-align: left;
    }

    .confirmation-box h1, .confirmation-box h2, .confirmation-box h4, .confirmation-box h6 {
      text-align: center;
    }

    .confirmation-box p {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .footer {
  width: 100%;
  padding: 1rem 5vw; 
  background-color: rgba(0, 0, 0, 0.7);
  color: #ffffff;
  text-align: center;
  font-size: clamp(12px, 2vw, 14px);
  backdrop-filter: blur(8px);
  margin-top: auto;
  box-sizing: border-box;
}


    .back-btn {
      margin-top: 30px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background-color: #ffffff;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Video Background -->
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="photo-bg.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Header -->
  <div class="header">
    <img class="logo-img" src="Wnobg.png" alt="Logo">
  </div>

  <!-- Confirmation Message -->
  <div class="confirmation-box">
    <h2>Thank You for Booking!</h2>
    <h1>BOOKING CONFIRMED!</h1>
    <div id="bookingDetails"></div>
    <h5 align="center">Your booking request has been successfully submitted.</h4>
    <h6>We will contact you shortly to finalize the details.</h6>

    <a href="index.html" class="back-btn">Back to Home</a>
  </div>
 <footer class="footer">
    &copy; 2025 WILFTOGRAPHY. All rights reserved. Unauthorized use or reproduction of any content is strictly prohibited.
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Function to get URL query parameters
      function getQueryParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      // Get and display query parameters in the HTML
      const name = decodeURIComponent(getQueryParameter("name"));
      const contact = decodeURIComponent(getQueryParameter("contact"));
      const email = decodeURIComponent(getQueryParameter("email"));
      const time = decodeURIComponent(getQueryParameter("time"));
      const theme = decodeURIComponent(getQueryParameter("theme"));

      // Populate the fields
      document.getElementById("name").textContent = name || "Not provided";
      document.getElementById("contact").textContent = contact || "Not provided";
      document.getElementById("email").textContent = email || "Not provided";
      document.getElementById("time").textContent = time || "Not provided";
      document.getElementById("theme").textContent = theme || "Not provided";
    });
  </script>



</body>
</html>
